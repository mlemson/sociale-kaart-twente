name: Valideer sociale kaart

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Controleer JavaScript
        run: |
          node --check app.js
          node --check portal.js
          node --check wegwijzer.js
      - name: Controleer bron-JSON en GeoJSON
        run: |
          python -m json.tool inventory.json > /dev/null
          python -m json.tool inventory.extra.json > /dev/null
          python -m json.tool twente.geojson > /dev/null
          python -m json.tool data/wegwijzer-curated.json > /dev/null
          python -m json.tool data/wegwijzer-themas.json > /dev/null
          python -m json.tool data/wegwijzer-expectations.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          taxonomy=json.loads(Path("data/wegwijzer-themas.json").read_text())
          valid=set()
          def walk(nodes, prefix=()):
              for node in nodes:
                  path=(*prefix, node["id"])
                  valid.add("/".join(path))
                  walk(node.get("children") or [], path)
          walk(taxonomy)

          for filename in ("inventory.json", "inventory.extra.json", "data/wegwijzer-curated.json"):
              data=json.loads(Path(filename).read_text())
              rows=data if isinstance(data, list) else data.get("candidates", [])
              for row in rows:
                  for path in row.get("guidePaths") or []:
                      assert path in valid, f"Onbekend Wegwijzer-pad {path!r} in {filename}: {row.get('name') or row.get('title')}"
          print(f"{len(valid)} geldige Wegwijzer-paden gecontroleerd")
          PY
      - name: Test catalogusgenerator
        run: |
          python tools/build_catalog.py
          python -m json.tool data/facilities.json > /dev/null
          python -m json.tool data/catalog.json > /dev/null
          python -m json.tool data/review-queue.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          facilities=json.loads(Path("data/facilities.json").read_text())
          catalog=json.loads(Path("data/catalog.json").read_text())
          assert facilities, "Geen kaartlocaties gegenereerd"
          assert catalog, "Geen organisaties gegenereerd"
          ids=[x["id"] for x in facilities]
          assert len(ids)==len(set(ids)), "Dubbele facility-id"
          for item in facilities:
              assert isinstance(item.get("lat"), (int,float)) and isinstance(item.get("lon"), (int,float)), item.get("name")
              assert -90 <= item["lat"] <= 90 and -180 <= item["lon"] <= 180, item.get("name")
              assert isinstance(item.get("physicalLocation"), bool), f"physicalLocation ontbreekt: {item.get('name')}"
              if item["physicalLocation"]:
                  assert item.get("mapLocationType") != "service-area", f"Fysieke locatie mag geen service-area zijn: {item.get('name')}"
                  assert item.get("locationType") not in {"contact", "source-address"}, f"Contactadres gemarkeerd als fysieke locatie: {item.get('name')}"
                  assert item.get("address") and item.get("town"), f"Fysieke locatie zonder adres: {item.get('name')}"
          print(f"{len(facilities)} kaartlocaties · {sum(1 for x in facilities if x['physicalLocation'])} fysiek · {len(catalog)} organisaties")
          PY
      - name: Audit Wegwijzer-indeling
        run: python tools/audit_wegwijzer.py
      - name: Controleer benodigde GitHub Pages bestanden
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
          test -f portal.css
          test -f portal.js
          test -f voorzieningen.html
          test -f wegwijzer.html
          test -f wegwijzer.css
          test -f wegwijzer.js
          test -f data/wegwijzer-curated.json
          test -f data/wegwijzer-themas.json
          test -f data/wegwijzer-expectations.json
          test -f data/facilities.json
          test -f data/catalog.json
