name: Eenmalig project uitpakken

on:
  push:
    branches: [main]
    paths:
      - 'site-core.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Project uitpakken
        run: |
          unzip -o site-core.zip
          rm -f site-core.zip
          rm -f .github/workflows/bootstrap.yml
      - name: Losse projectbestanden committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Plaats complete Sociale kaart Twente" || exit 0
          git push
