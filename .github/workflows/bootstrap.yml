name: Eenmalig project uitpakken

on:
  push:
    branches: [main]
    paths:
      - 'site-core.ready'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Project herstellen uit tijdelijke delen
        run: |
          cat site-core.tar.xz.b64.part* | base64 --decode > site-core.tar.xz
          tar -xJf site-core.tar.xz
          rm -f site-core.tar.xz site-core.ready site-core.tar.xz.b64.part*
          rm -f .github/workflows/bootstrap.yml
      - name: Losse projectbestanden committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Plaats complete Sociale kaart Twente" || exit 0
          git push
