name: Eenmalig project uitpakken

on:
  push:
    branches: [main, simplify-content-workflow]
    paths:
      - 'site-core.ready'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Project herstellen uit tijdelijke delen
        run: |
          python - <<'PY'
          import base64, glob, pathlib, re
          parts = sorted(glob.glob("site-core.tar.xz.b64.part*"))
          encoded = "".join(pathlib.Path(p).read_text(encoding="utf-8") for p in parts)
          encoded = re.sub(r"\s+", "", encoded)
          encoded += "=" * (-len(encoded) % 4)
          pathlib.Path("site-core.tar.xz").write_bytes(base64.b64decode(encoded, validate=True))
          print(f"Hersteld uit {len(parts)} delen ({len(encoded)} base64-tekens)")
          PY
          set +e
          tar -xJf site-core.tar.xz
          tar_status=$?
          set -e
          echo "tar exit status: $tar_status (0 = volledig, anders gedeeltelijk hersteld)"
          rm -f site-core.tar.xz
          echo "Herstelde bestanden:"
          find . -maxdepth 3 -type f ! -path './.git/*' | sort
      - name: Herstelde projectbestanden committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Herstel beschikbare Sociale kaart projectbestanden" || exit 0
          git push
