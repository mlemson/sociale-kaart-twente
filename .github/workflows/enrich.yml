name: Adressen en catalogus bijwerken

on:
  push:
    paths:
      - 'inventory.json'
      - 'inventory.extra.json'
      - 'tools/enrich_addresses.py'
      - 'tools/build_catalog.py'
      - 'local-backend/facilities.base.json'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

concurrency:
  group: sociale-kaart-enrichment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Zoek adressen en geocodeer via PDOK
        run: python tools/enrich_addresses.py
      - name: Bouw publieke catalogus en kaartdata
        run: python tools/build_catalog.py
      - name: Sla gewijzigde bron- en kaartdata op
        run: |
          if git diff --quiet -- inventory.json inventory.extra.json data/; then
            echo "Geen wijzigingen"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory.json inventory.extra.json data/facilities.json data/catalog.json data/review-queue.json
          git commit -m "Werk adressen en sociale kaart catalogus bij"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
