name: Voorinvulling opnieuw uitvoeren

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verrijk inventarisatie en kaartlocaties
        run: python tools/enrich_all.py
      - name: Sla wijzigingen op
        run: |
          if git diff --quiet; then
            echo "Geen wijzigingen"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory.json data/facilities.json
          git commit -m "Update automatische voorinvulling"
          git push
