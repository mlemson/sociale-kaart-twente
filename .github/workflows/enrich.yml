name: Catalogus en aandachtspunten bijwerken

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bouw publieke catalogus en uitzonderingenlijst
        run: python tools/build_catalog.py
      - name: Sla gewijzigde publieke data op
        run: |
          if git diff --quiet -- data/; then
            echo "Geen wijzigingen"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/facilities.json data/catalog.json data/review-queue.json
          git commit -m "Werk sociale kaart catalogus bij"
          git push
